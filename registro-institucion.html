<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Registrar institución - MOTI Queue</title>

</head>

<body>

    <h1>MOTI Queue</h1>

    <p>Crear una nueva institución</p>


    <!-- ==============================
         DATOS DE LA INSTITUCIÓN
    =============================== -->

    <h2>Datos de la institución</h2>

    <input
        type="text"
        id="txtInstitucion"
        placeholder="Nombre de la institución"
    >

    <input
        type="text"
        id="txtMunicipio"
        placeholder="Municipio"
    >

    <input
        type="text"
        id="txtDireccion"
        placeholder="Dirección"
    >

    <input
        type="tel"
        id="txtTelefono"
        placeholder="Teléfono"
    >


    <!-- ==============================
         DATOS DEL ADMINISTRADOR
    =============================== -->

    <h2>Datos del administrador</h2>

    <input
        type="text"
        id="txtAdministrador"
        placeholder="Nombre del administrador"
    >

    <input
        type="email"
        id="txtCorreo"
        placeholder="Correo electrónico"
    >

    <input
        type="password"
        id="txtPassword"
        placeholder="Contraseña"
    >


    <!-- ==============================
         CREAR
    =============================== -->

    <button id="btnCrear">

        Crear institución

    </button>


    <div id="mensaje"></div>


    <br>

    <a href="login.html">

        Ya tengo una cuenta

    </a>


    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script
        type="module"
        src="js/registro-institucion.js">
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crear Institución | MOTI Queue</title>

<link rel="stylesheet" href="css/registro-institucion.css">

</head>

<body>

<div class="contenedor">

    <h1>MOTI Queue</h1>

    <p>Crear una nueva institución</p>

    <input
        type="text"
        id="txtInstitucion"
        placeholder="Nombre de la institución">

    <input
        type="text"
        id="txtAdministrador"
        placeholder="Nombre del administrador">

    <input
        type="email"
        id="txtCorreo"
        placeholder="Correo electrónico">

    <input
        type="password"
        id="txtPassword"
        placeholder="Contraseña">

    <input
        type="tel"
        id="txtTelefono"
        placeholder="Teléfono (opcional)">

    <button id="btnCrear">

        Crear institución

    </button>

    <div id="mensaje"></div>

    <br>

    <a href="login.html">

        Ya tengo una cuenta

    </a>

</div>

<script type="module" src="js/registro-institucion.js"></script>

</body>

</html>

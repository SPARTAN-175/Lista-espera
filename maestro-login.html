<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#0b8f3c">

    <title>
        Acceso Maestro - MOTI Queue
    </title>

    <link
        rel="stylesheet"
        href="css/maestro-login.css">

</head>


<body>


    <main class="contenedor">


        <section class="login-card">


            <div class="marca">

                <img
                    src="img/logo.png"
                    alt="MOTI Queue">

            </div>


            <span class="etiqueta">
                ADMINISTRACIÓN
            </span>


            <h1>
                MOTI Queue
            </h1>


            <p class="subtitulo">
                Panel maestro
            </p>


            <div class="separador">
            </div>


            <label for="correo">
                Correo electrónico
            </label>


            <input
                type="email"
                id="correo"
                placeholder="Correo electrónico"
                autocomplete="username">


            <label for="password">
                Contraseña
            </label>


            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    autocomplete="current-password">


                <button
                    type="button"
                    id="btnMostrarPassword"
                    aria-label="Mostrar contraseña">

                    👁

                </button>

            </div>


            <button
                id="btnIngresar"
                class="btn-principal"
                type="button">

                Iniciar sesión

            </button>


            <div
                id="mensaje"
                class="mensaje">

            </div>


            <p class="seguridad">

                🔒 Acceso exclusivo para administración
                de MOTI Queue.

            </p>


        </section>


    </main>


    <script
        type="module"
        src="js/maestro-login.js">
    </script>


</body>

</html>

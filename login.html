<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOTI Queue</title>

<link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="login-container">

    <img
        src="img/logo.png"
        class="logo"
        alt="MOTI Queue">

    <h1>MOTI Queue</h1>

    <p>

        Sistema Inteligente de Gestión de Turnos

    </p>

    <input
        type="email"
        id="correo"
        placeholder="Correo electrónico">

    <input
        type="password"
        id="password"
        placeholder="Contraseña">

    <button id="btnIngresar">

        Iniciar sesión

    </button>

    <div id="mensaje"></div>

</div>

<script type="module" src="js/login.js"></script>

</body>

</html>

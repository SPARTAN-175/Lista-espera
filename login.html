<div class="login-container">

    <div class="login-card">

        <img
            src="img/logo.png"
            class="logo"
            alt="MOTI Queue">


        <h1>
            MOTI Queue
        </h1>


        <p class="subtitulo">
            Sistema Inteligente de Gestión de Turnos
        </p>


        <!-- =================================
             ACCESO PERSONAL
        ================================== -->

        <div class="login-form">

            <label for="correo">
                Correo electrónico o usuario
            </label>


            <input
                type="text"
                id="correo"
                placeholder="Correo o ATN-XXXXXXXX"
                autocomplete="username">


            <label for="password">
                Contraseña
            </label>


            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    autocomplete="current-password">


                <button
                    type="button"
                    id="btnMostrarPassword"
                    class="btn-password"
                    aria-label="Mostrar contraseña">

                    👁

                </button>

            </div>


            <button
                id="btnIngresar"
                class="btn-principal">

                Iniciar sesión

            </button>


            <button
                type="button"
                id="btnRecuperarPassword"
                class="btn-recuperar">

                ¿Olvidaste tu contraseña?

            </button>

        </div>


        <!-- =================================
             SEPARADOR
        ================================== -->

        <div class="separador">

            <span>
                o
            </span>

        </div>


        <!-- =================================
             ACCESO CAPTURISTA
        ================================== -->

        <div class="acceso-qr">

            <div class="qr-icono">
                ▣
            </div>


            <h2>
                Acceso con dispositivo
            </h2>


            <p>
                Escanea el código QR proporcionado
                por el administrador.
            </p>


            <button
                id="btnEscanearQR"
                class="btn-qr">

                Escanear código QR

            </button>

        </div>


        <!-- =================================
             LECTOR QR
        ================================== -->

        <div
            id="lectorQR"
            class="lector-qr">

        </div>


        <!-- =================================
             MENSAJE
        ================================== -->

        <div
            id="mensaje"
            class="mensaje">

        </div>

    </div>

</div>

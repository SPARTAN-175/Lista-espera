<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/estilos.css">
<meta name="theme-color" content="#2563eb">
<title>Sistema de Lista de Espera</title>

</head>

<body>

<div class="fecha-hoy">

    <div id="fechaHoy"></div>

    <div id="horaActualSistema"></div>

</div>

<h1>📋 Sistema de Espera</h1>

<div class="card">

<div class="stats">
  <div>⏳ Pendientes: <span id="pendientes">0</span></div>
  <div>✅ Atendidos: <span id="atendidos">0</span></div>
</div>

<input id="nombre" placeholder="Nombre de la persona">

<button class="agregar" onclick="agregarPersona()">
  Agregar Persona
</button>

</div>

<div id="lista"></div>

<script type="module">

import { db } from "./js/firebase.js";

import {
  collection,
  addDoc,
  updateDoc,
  doc,
  getDoc,
  onSnapshot,
  query,
  getDocs,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


/*==================================
CONFIGURACIÓN DEL SISTEMA
==================================*/

const CONFIG = {

    institucion: "OST001",

    sistema: {}

};
let MODO = "capturista";
    
/*==================================
OBTENER FECHA DEL DÍA
==================================*/

function obtenerFechaActual() {

    const hoy = new Date();

    const anio = hoy.getFullYear();

    const mes = String(hoy.getMonth() + 1).padStart(2, "0");

    const dia = String(hoy.getDate()).padStart(2, "0");

    return `${anio}-${mes}-${dia}`;

}

/*==================================
VERIFICAR CAMBIO DE DÍA
==================================*/

let fechaSistema = obtenerFechaActual();

let detenerEscucha = null;

setInterval(async() => {

    const nuevaFecha = obtenerFechaActual();

    if (nuevaFecha !== fechaSistema) {

        fechaSistema = nuevaFecha;

        await cargarConfiguracion();

iniciarEscucha();

    }

}, 60000);
    
/*==================================
OBTENER REFERENCIA DE LA LISTA DEL DÍA
==================================*/

function obtenerListaRef() {

    return collection(

        db,

        "instituciones",

        CONFIG.institucion,

        "listas",

        obtenerFechaActual(),

        "personas"

    );

    }

/*==================================
OBTENER REFERENCIA DE UNA PERSONA
==================================*/

function obtenerPersonaRef(id) {

    return doc(

        db,

        "instituciones",

        CONFIG.institucion,

        "listas",

        obtenerFechaActual(),

        "personas",

        id

    );

}

/*==================================
CARGAR CONFIGURACIÓN DEL SISTEMA
==================================*/

async function cargarConfiguracion() {

    const referencia = doc(
        db,
        "instituciones",
        CONFIG.institucion,
        "configuracion",
        "sistema"
    );

    const documento = await getDoc(referencia);

    if (!documento.exists()) {

        console.error("No existe la configuración del sistema.");

        return;

    }

    CONFIG.sistema = documento.data();

    console.log("Configuración cargada:", CONFIG.sistema);

}

/*==================================
FECHA Y HORA
==================================*/

function actualizarFechaHora(){

    const ahora = new Date();

    const fecha = ahora.toLocaleDateString("es-MX",{

        weekday:"long",

        year:"numeric",

        month:"long",

        day:"numeric"

    });

    const hora = ahora.toLocaleTimeString("es-MX",{

        hour:"2-digit",

        minute:"2-digit",

        second:"2-digit"

    });

    document.getElementById("fechaHoy").textContent = fecha;

    document.getElementById("horaActualSistema").textContent = hora;

}

actualizarFechaHora();

setInterval(actualizarFechaHora,1000);

    

// 🔢 AGREGAR PERSONA (turno automático correcto)
window.agregarPersona = async function () {

  const nombre = document.getElementById("nombre").value.trim();
  if (!nombre) return alert("Escribe un nombre");

  const snapshot = await getDocs(obtenerListaRef());

  let maxTurno = 0;

  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    if (data.turno > maxTurno) {
      maxTurno = data.turno;
    }
  });

  const nuevoTurno = maxTurno + 1;

  const hora = new Date().toLocaleTimeString();

await addDoc(obtenerListaRef(), {

    turno: nuevoTurno,

    nombre: nombre,

    hora: hora,

    estado: "pendiente",

    fecha: obtenerFechaActual(),

    timestamp: Date.now()

});

  document.getElementById("nombre").value = "";

mostrarTicket(
    nuevoTurno,
    nombre,
    hora
);
};

// 🟢 MARCAR COMO ATENDIDO
window.atender = async function (id) {

    await updateDoc(
        obtenerPersonaRef(id),
        {
            estado: "atendido"
        }
    );

};

// 🟠 MARCAR COMO INCOMPLETO
window.incompleto = async function (id) {

    await updateDoc(
        obtenerPersonaRef(id),
        {
            estado: "incompleto"
        }
    );

};

// 🔄 TIEMPO REAL
function iniciarEscucha() {

  if (detenerEscucha) {
    detenerEscucha();
  }

  const q = query(
    obtenerListaRef(),
    orderBy("turno")
  );

  detenerEscucha = onSnapshot(q, (snapshot) => {

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    let pendientes = 0;
    let atendidos = 0;

    snapshot.forEach(d => {

      const p = d.data();

      if (p.estado === "pendiente") pendientes++;
      else atendidos++;

      lista.innerHTML += `
        <div class="persona">
          <div>
            <strong>T${String(p.turno).padStart(3,'0')}</strong> - ${p.nombre}
            <br>
            <small>${p.hora}</small>
            <div class="${p.estado === 'pendiente' ? 'estado-pendiente' : 'estado-atendido'}">
              ${p.estado.toUpperCase()}
            </div>
          </div>

          ${MODO === "atencion"
  ? (
      p.estado === "pendiente"
        ? `
          <div class="acciones">

            <button
              class="incompleto"
              onclick="incompleto('${d.id}')">

              Incompleto

            </button>

            <button
              class="atendido"
              onclick="atender('${d.id}')">

              Atender

            </button>

          </div>
        `
        : p.estado === "incompleto"
        ? `
          <div class="acciones">

            <span class="estado-incompleto">

              ⚠ Incompleto

            </span>

            <button
              class="atendido"
              onclick="atender('${d.id}')">

              Atender

            </button>

          </div>
        `
        : `<button disabled>Atendido</button>`
    )
  : ""
          }

        </div>
      `;

    });

    document.getElementById("pendientes").textContent = pendientes;
    document.getElementById("atendidos").textContent = atendidos;

  });

    }

iniciarEscucha();
// 🔄 NUEVO DÍA (simple)

//const enlaceConsulta =
//"https://spartan-175.github.io/Lista-espera/consulta.html";

/*==================================
MOSTRAR TICKET
==================================*/

function mostrarTicket(turno, nombre, hora){

    document.getElementById("ticketTurno").textContent =
        "T" + String(turno).padStart(3,"0");

    document.getElementById("ticketNombre").textContent =
        nombre;

    document.getElementById("ticketHora").textContent =
        "🕒 " + hora;

   /* const qr = document.getElementById("ticketQR");

qr.innerHTML = "";

new QRCode(qr,{

    text: enlaceConsulta,

    width:120,

    height:120

});*/

    document
        .getElementById("ticketModal")
        .classList
        .add("show");

}

/*==================================
CERRAR TICKET
==================================*/

document
.getElementById("cerrarTicket")
.addEventListener("click",()=>{

    document
    .getElementById("ticketModal")
    .classList
    .remove("show");

});

    
</script>


<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>


<!--
=========================================

=========================================

    <div class="ticket">

        <div class="ticket-success">

            ✅

        </div>

        <h2>

            Registro exitoso

        </h2>

        <p>

            Credencialización de Salud Universal

        </p>

     <div class="ticket-divider"></div>

        <small>SU TURNO ES</small>

        <div
            class="ticket-turno"
            id="ticketTurno">

            T000

        </div>

        <div
            class="ticket-nombre"
            id="ticketNombre">

            Nombre de la persona

        </div>

        <div
            class="ticket-hora"
            id="ticketHora">

            🕒 00:00

        </div>

       <div class="ticket-divider"></div>

        <p class="ticket-texto">

            Conserve este número de turno.

Si desea consultar el avance de la fila,
escanee el código QR disponible
en el módulo de atención.
        </p>
        
     <!--   <div class="ticket-divider"></div>

<div id="ticketQR"></div>-->

        <button id="cerrarTicket">

            Cerrar

        </button>

    </div>

</div>



<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</body>
</html>

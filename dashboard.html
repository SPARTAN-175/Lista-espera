<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MOTI Queue</title>

    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<header class="header">

    <h1>MOTI Queue</h1>

    <button id="btnSalir">
        Cerrar sesión
    </button>

</header>

<main class="contenedor">

    <h2 id="bienvenida">
        Bienvenido
    </h2>

    <div class="menu">

        <button class="card">🏢 Instituciones</button>

        <button class="card">👥 Usuarios</button>

        <button class="card">📍 Módulos</button>

        <button
    class="card"
    id="btnVinculacion">

    🔗 Vincular capturistas

        </button>

        <button class="card">⚙️ Configuración</button>

        <button
    class="card"
    id="btnQRConsulta">

    📱 Generar QR de Consulta

</button>

    </div>

</main>


<!-- ========================================= -->
<!-- MODAL QR CONSULTA -->
<!-- ========================================= -->

<div id="modalQRConsulta" class="modalQR oculto">

    <div class="panelQR">

        <h2>
            📱 Consulta de Turnos
        </h2>

        <p class="descripcionQR">
            Escanee este código para consultar el avance de la fila.
        </p>

        <div id="contenedorQR"></div>

        <h3 id="nombreInstitucionQR">
            Institución
        </h3>

        <p id="urlConsultaQR"></p>

        <div class="accionesQR">

            <button id="btnDescargarQR">
                📥 Descargar
            </button>

            <button id="btnImprimirQR">
                🖨️ Imprimir
            </button>

            <button id="btnCerrarQR">
                Cerrar
            </button>

        </div>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script type="module" src="js/dashboard.js"></script>


</body>
</html>
